<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화이팅! 넌 할 수 있어! ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
    <!-- Theme Toggle -->
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">🌙</button>

    <!-- Floating background elements (Cat Theme) -->
    <div class="floating-bg">
        <span class="bubble">🐱</span>
        <span class="bubble">🐾</span>
        <span class="bubble">🐟</span>
        <span class="bubble">🍀</span>
        <span class="bubble">🧶</span>
        <span class="bubble">✨</span>
    </div>

    <div class="container">
        <!-- Hero Section -->
        <header class="hero">
            <h1>화이팅! 다 잘 될 거야 🍀</h1>
            <p>곧 시험이네, 너무 스트레스 받지 마. 널 위해 작은 깜짝 선물을 준비했어!</p>
        </header>

        <!-- Interactive Envelope -->
        <div class="envelope-wrapper">
            <div id="envelope" class="envelope">
                <div class="front flap"></div>
                <div class="cat">🐱</div>
                <div class="front pocket"></div>
                <div class="letter">
                    <div class="words line1">소율이에게,</div>
                    <div class="words line2">시험 잘 봐! 성적이 너의 전부를 말해주는 건 아니라는 걸 기억해. 최선을 다하면 그걸로 충분해. 많이 사랑해 💕</div>
                    <div class="words line3">- Kang -</div>
                </div>
            </div>
            <p class="instruction">👆 편지를 클릭해서 열어봐 👆</p>
        </div>

        <!-- Lucky Charm Section -->
        <div class="lucky-charm-section">
            <h3>조금 지쳐? 냥냥이 에너지를 받아가! 👇</h3>
            <button id="charm-btn" class="cute-btn">행운의 고양이 발바닥 받기 🐾</button>
            <div id="charm-message" class="hidden"></div>
        </div>
    </div>

    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
